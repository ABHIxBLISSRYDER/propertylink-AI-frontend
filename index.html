
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="PropertyLink AI — Intelligent property SEO and backlink management."
    />

    <meta name="theme-color" content="#F5F7FB" />

    <title>PropertyLink AI | AEO Management Platform</title>

    <script>
      (function () {
        const savedTheme = localStorage.getItem('propertylink_theme');
        const theme = savedTheme || 'light';

        const resolvedTheme =
          theme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme;

        document.documentElement.setAttribute(
          'data-theme',
          resolvedTheme
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
